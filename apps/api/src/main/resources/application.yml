spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: budget-manager-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
  flyway:
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    placeholders:
      seed_user_email: ${APP_SEED_USER_EMAIL:}
      seed_user_name: ${APP_SEED_USER_NAME:}
      seed_user_password_hash: ${APP_SEED_USER_PASSWORD_HASH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

cors:
  frontend: ${CORS_FRONTEND:http://localhost:3000}

cookies:
  secure: ${COOKIE_SECURE:false}

app:
  uploads:
    max-profile-image-bytes: ${MAX_PROFILE_IMAGE_BYTES:2097152}
