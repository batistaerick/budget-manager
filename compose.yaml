name: budget-manager

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budget_manager}
      POSTGRES_USER: ${POSTGRES_USER:-budget_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget_manager_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: apps/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-budget_manager}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-budget_manager}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-budget_manager_local_only}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:-budget-manager-local-secret-change-me}
      COOKIE_SECURE: "false"
      CORS_FRONTEND: http://localhost:${WEB_PORT:-3000}
      APP_SEED_USER_EMAIL: ${APP_SEED_USER_EMAIL:-}
      APP_SEED_USER_NAME: ${APP_SEED_USER_NAME:-}
      APP_SEED_USER_PASSWORD_HASH: ${APP_SEED_USER_PASSWORD_HASH:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
